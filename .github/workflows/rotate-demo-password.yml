name: Rotate demo password

on:
  schedule:
    # A few minutes after UTC midnight, so the day boundary has definitely
    # rolled over on Cloudflare's side before this runs.
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive today's password and update README
        env:
          BASIC_AUTH_SEED: ${{ secrets.BASIC_AUTH_SEED }}
        run: node .github/scripts/rotate-demo-password.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "Already up to date."
          else
            git add README.md
            git commit -m "chore: rotate published demo password"
            git push
          fi
